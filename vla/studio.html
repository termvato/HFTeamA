<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recording Studio</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #16181d; --muted: #646b78; --line: #e2e5ea;
    --accent: #2f6fdf; --rec: #d93b3b; --ok: #1f9d55; --warn: #c98a12; --btn: #eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111317; --panel: #1a1d23; --ink: #e8eaee; --muted: #9aa1ad; --line: #2b2f37;
      --accent: #5b8ff0; --rec: #ef5b5b; --ok: #39b873; --warn: #e0a83a; --btn: #252931;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
           padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .meta { color: var(--muted); font-size: 13px; }
  .pill { padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
          text-transform: uppercase; letter-spacing: .04em; background: var(--btn); color: var(--muted); }
  .pill.recording { background: var(--rec); color: #fff; animation: blink 1.2s infinite; }
  .pill.idle { background: var(--ok); color: #fff; }
  .pill.preview, .pill.saving, .pill.uploading, .pill.connecting { background: var(--warn); color: #fff; }
  @keyframes blink { 50% { opacity: .55; } }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; padding: 16px 20px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 16px; } }
  /* Fixed slots: the first view (top) large on the left, the others stacked on the right. */
  .cams { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; align-content: start; }
  .cam:first-child { grid-row: span 2; }
  .cam:nth-child(n+4) { grid-column: span 2; }
  @media (max-width: 700px) { .cams { grid-template-columns: 1fr; } .cam:first-child { grid-row: auto; } }
  .cam { background: #000; border-radius: 10px; overflow: hidden; position: relative; aspect-ratio: 4 / 3;
         border: 1px solid var(--line); }
  .cam img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .cam .label { position: absolute; left: 8px; top: 6px; color: #fff; font-size: 12px; z-index: 1;
                background: rgba(0,0,0,.55); padding: 1px 8px; border-radius: 6px; }
  .cam .why { position: absolute; inset: 0; display: none; place-items: center; text-align: center;
              padding: 28px 16px 16px; color: #9aa1ad; font-size: 13px; word-break: break-word;
              background: repeating-linear-gradient(45deg, #15171b 0 12px, #1a1d22 12px 24px); }
  .cam.off img { display: none; }
  .cam.off .why { display: grid; }
  .cam.off .label { background: rgba(255,255,255,.08); color: #c9ced6; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  aside { display: flex; flex-direction: column; gap: 12px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--btn); color: var(--ink);
           padding: 8px 12px; border-radius: 8px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.rec { background: var(--rec); border-color: var(--rec); color: #fff; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > button { flex: 1; }
  .big button { padding: 12px; font-weight: 600; }
  kbd { font-size: 11px; opacity: .75; margin-left: 4px; }
  textarea { width: 100%; font: inherit; color: var(--ink); background: var(--bg);
             border: 1px solid var(--line); border-radius: 8px; padding: 8px; resize: vertical; min-height: 54px; }
  .bar { height: 8px; background: var(--btn); border-radius: 99px; overflow: hidden; margin: 10px 0 4px; }
  .bar div { height: 100%; width: 0; background: var(--rec); transition: width .4s linear; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: 13px; }
  .stats b { font-variant-numeric: tabular-nums; font-weight: 600; }
  .stats span { color: var(--muted); }
  .msg { font-size: 13px; }
  .err { color: var(--rec); font-size: 12px; margin-top: 6px; word-break: break-word; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
  td { padding: 2px 0; } td:last-child { text-align: right; }
  label { display: flex; gap: 8px; align-items: center; font-size: 13px; margin-top: 10px; color: var(--muted); }
  a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Recording Studio</h1>
  <span id="state" class="pill">…</span>
  <span class="meta" id="repo"></span>
  <span class="meta" id="hz"></span>
</header>

<main>
  <section>
    <div class="cams" id="cams"></div>
  </section>

  <aside>
    <div class="panel">
      <h2>Connection</h2>
      <div class="row">
        <button id="connect" class="primary">Connect arms</button>
        <button id="preview">Cameras only</button>
        <button id="disconnect">Disconnect</button>
      </div>
    </div>

    <div class="panel">
      <h2>Episode</h2>
      <textarea id="task" placeholder="Pick up the red cube and put it in the box"></textarea>
      <div class="bar"><div id="progress"></div></div>
      <div class="stats">
        <span>Time</span><b id="elapsed">0 / 0 s</b>
        <span>Frames</span><b id="frames">0</b>
        <span>On disk</span><b id="episodes">0</b>
        <span>This session</span><b id="session">0</b>
      </div>
      <div class="row big" style="margin-top:12px">
        <button id="start" class="rec">Start<kbd>Space</kbd></button>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="save">Save<kbd>→</kbd></button>
        <button id="discard">Discard<kbd>←</kbd></button>
      </div>
      <label><input type="checkbox" id="auto"> Auto-start next episode after the reset time</label>
    </div>

    <div class="panel">
      <h2>Status</h2>
      <div class="msg" id="msg"></div>
      <div class="err" id="err"></div>
      <div class="row" style="margin-top:12px">
        <button id="upload">Upload to Hugging Face</button>
      </div>
      <div class="msg" id="url" style="margin-top:8px"></div>
    </div>

    <div class="panel">
      <h2>Joints (follower)</h2>
      <table id="joints"><tr><td class="meta">—</td></tr></table>
    </div>
  </aside>
</main>

<script>
const $ = (id) => document.getElementById(id);
let S = {}, camKeys = "", taskTouched = false;

async function post(action, body = {}) {
  const r = await fetch(`/api/${action}`, { method: "POST", headers: { "Content-Type": "application/json" },
                                            body: JSON.stringify(body) });
  if (r.ok) render(await r.json());
}

function render(s) {
  S = s;
  $("state").textContent = s.state;
  $("state").className = "pill " + s.state;
  $("repo").textContent = `${s.mode} · ${s.repo_id}${s.private ? " (private)" : ""}`;
  $("hz").textContent = s.hz ? `${s.hz} / ${s.fps} Hz` : "";
  if (!taskTouched && document.activeElement !== $("task")) $("task").value = s.task;

  renderSlots(s.slots);

  const rec = s.state === "recording";
  $("elapsed").textContent = rec ? `${s.elapsed} / ${s.episode_time_s} s`
                           : (s.reset_left ? `reset ${s.reset_left} s` : `0 / ${s.episode_time_s} s`);
  $("progress").style.width = rec ? `${Math.min(100, 100 * s.elapsed / s.episode_time_s)}%` : "0";
  $("frames").textContent = s.frames;
  $("episodes").textContent = s.episodes;
  $("session").textContent = s.session_saved;
  $("auto").checked = s.auto_next;

  $("connect").disabled = !["disconnected", "preview"].includes(s.state);
  $("preview").disabled = s.state !== "disconnected";
  $("disconnect").disabled = !["idle", "preview", "recording"].includes(s.state);
  $("start").disabled = s.state !== "idle";
  $("save").disabled = !rec;
  $("discard").disabled = !rec;
  $("upload").disabled = s.state !== "idle" || !s.episodes;

  $("msg").textContent = s.message;
  $("err").textContent = s.error;
  $("url").innerHTML = s.url ? `<a href="${s.url}" target="_blank" rel="noopener">${s.url}</a>` : "";

  const j = Object.entries(s.joints);
  $("joints").innerHTML = j.length
    ? j.map(([k, v]) => `<tr><td>${k.replace(".pos", "")}</td><td>${v.toFixed(1)}</td></tr>`).join("")
    : `<tr><td class="meta">—</td></tr>`;
}

// One fixed box per camera view, built once. A box switches between its live feed and a
// placeholder saying why it is empty; the stream is (re)opened only when a view goes live.
function renderSlots(slots) {
  const names = slots.map(v => v.name).join(",");
  if (names !== camKeys) {
    camKeys = names;
    $("cams").innerHTML = slots.map(v =>
      `<div class="cam off" id="cam-${v.name}"><span class="label"></span>` +
      `<img alt="${v.name} camera"><div class="why"></div></div>`).join("");
  }
  for (const v of slots) {
    const box = $(`cam-${v.name}`), img = box.querySelector("img");
    box.querySelector(".label").textContent = v.live ? `${v.name} · ${v.size}` : v.name;
    box.querySelector(".why").textContent = v.live ? "" : v.why;
    if (v.live && box.classList.contains("off")) img.src = `/stream/${v.name}?t=${Date.now()}`;
    if (!v.live && !box.classList.contains("off")) img.removeAttribute("src");  // closes the stream
    box.classList.toggle("off", !v.live);
  }
}

$("connect").onclick = () => post("connect");
$("preview").onclick = () => post("connect", { cameras_only: true });
$("disconnect").onclick = () => {
  if (S.state === "preview" || confirm("Disconnect turns the follower's torque off and it will drop.\n" +
      "Put the follower in its rest pose first.\n\nDisconnect now?")) post("disconnect");
};
$("start").onclick = () => { taskTouched = false; post("start", { task: $("task").value }); };
$("save").onclick = () => post("save");
$("discard").onclick = () => post("discard");
$("auto").onchange = (e) => post("auto", { on: e.target.checked });
$("upload").onclick = () => post("upload");
$("task").oninput = () => { taskTouched = true; };

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "TEXTAREA") return;
  const k = { " ": "start", ArrowRight: "save", ArrowLeft: "discard" }[e.key];
  if (!k || $(k).disabled) return;
  e.preventDefault();
  $(k).click();
});

async function poll() {
  try { render(await (await fetch("/api/status")).json()); }
  catch { $("state").textContent = "server down"; $("state").className = "pill"; }
  setTimeout(poll, 400);
}
poll();
</script>
</body>
</html>
