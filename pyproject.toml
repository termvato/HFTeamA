[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hfteama"
version = "0.1.0"
description = "HFTeamA project."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
hfteama = "hfteama.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hfteama"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
