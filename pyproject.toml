[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hfteama"
version = "0.1.0"
description = "Plug and produce: re-split a batch of work live across N SO-101 arms."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
sched = ["ortools>=9.10"]
view = ["dash>=2.17", "plotly>=5.22"]
sim = ["mujoco>=4.0.1"]
# Local Qwen VLM from Hugging Face (decomposer, step check). Install torch for your GPU first.
vlm = ["transformers>=4.57", "accelerate>=1.0", "torch>=2.4", "torchvision", "bitsandbytes>=0.45", "pillow>=10.0"]
# Top camera: grab frames (ffmpeg) and calibrate from the ArUco markers on the table.
camera = ["opencv-python>=4.7,<5", "imageio-ffmpeg>=0.5"]
# Plug-in detection (hfteama.discovery): USB serial numbers, on Linux, macOS and Windows.
arms = ["pyserial>=3.5"]
# Orchestra dashboard API (python -m hfteama.demo ... --orchestra).
orchestra = ["fastapi>=0.115", "uvicorn>=0.30"]
# Real arms through the sorter (docs/hardware/sorter.md): overhead camera, Feetech followers via
# LeRobot (the version the rig runs), planner, live screen, Rerun viewer. scripts/setup_sorter.sh
# (OpenCV comes with LeRobot as opencv-python-headless: with ArUco; a second cv2 would clash.)
sorter = [
    "pyserial>=3.5",
    "lerobot[feetech]==0.7.0",
    "ortools>=9.10",
    "dash>=2.17",
    "plotly>=5.22",
    "rerun-sdk>=0.33",
]
# Real arms: LeRobot installed from source (see docs/plan.md), not pinned here.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "httpx>=0.27",  # FastAPI's TestClient (tests/test_orchestra.py)
]

[project.scripts]
hfteama = "hfteama.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hfteama"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["sim: needs MuJoCo (pip install -e \".[sim]\")"]

[tool.ruff]
line-length = 100
extend-exclude = ["*.md"]  # never reformat code blocks inside docs
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/validation/*" = ["E501", "E401", "E702", "F401", "I001"]  # one-off check scripts
"vla/*" = ["E501"]  # LeRobot helper scripts with long command lines
