[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hfteama"
version = "0.1.0"
description = "Plug and produce: re-split a batch of work live across N SO-101 arms."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
sched = ["ortools>=9.10"]
view = ["dash>=2.17", "plotly>=5.22"]
sim = ["mujoco>=3.2"]
# Local Qwen VLM from Hugging Face (decomposer, step check). Install torch for your GPU first.
vlm = ["transformers>=4.57", "accelerate>=1.0", "torch>=2.4", "pillow>=10.0"]
# Real arms: LeRobot installed from source (see docs/plan.md), not pinned here.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
hfteama = "hfteama.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hfteama"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
