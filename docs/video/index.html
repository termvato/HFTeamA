<!doctype html><html><head><meta charset="utf-8"><title>Orchestra: click-through</title>
<style>
html,body{margin:0;height:100%;background:#0A0A0A;overflow:hidden;font-family:system-ui,sans-serif}
video{position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;background:#0A0A0A}
#n{position:fixed;left:10px;top:8px;background:#E6FF3D;color:#0A0A0A;font:700 22px/1 system-ui;padding:6px 10px}
#t{position:fixed;left:0;right:0;bottom:0;background:rgba(10,10,10,.88);color:#F5F4EF;font:500 26px/1.35 system-ui;padding:16px 28px;display:none}
#h{position:fixed;right:10px;top:8px;color:#888;font:12px system-ui}
</style></head><body>
<video id="v" muted playsinline autoplay></video><div id="n"></div><div id="h">click / space / right arrow: next &middot; left arrow: back &middot; T: text &middot; N: number &middot; F: full screen &middot; R: replay</div><div id="t"></div>
<script>
const LINES=["It's two minutes to your call, and your desk is a mess. You need more hands, right now. These two are tidying it with a learned policy, managed by Orchestra.", "A robot arm now costs a hundred dollars. Putting it to work costs far more: every new task, every new arm, every new layout means new data, new training, new code. Add a second arm, and you start over.", "Orchestra changes that. Build a skill once, for one arm. A camera locates every object, a reach model decides which arm can take what, and a scheduler predicts the finish before anything moves.", "This is real hardware. One arm starts tidying, running one skill: pick and place, by calibrated inverse kinematics. It knows what it can reach, and it tells you exactly how long it needs.", "In a hurry? Plug in another arm, and the plan rewrites itself.", "No setup. No retraining. In under a second the new arm is detected by its USB, given its share of the work, and moving, running the very same skill. The plan adapts in real time.", "Two arms, the same skill, managed by Orchestra. Zero coordination code. They pick in parallel. Locks on shared space mean they never collide at the tray, and a heartbeat watches every arm. The whole desk, tidied.", "And when a job needs two arms as one, a learned policy moves the whole tray.", "When a grasp misses, Orchestra re-scans and re-plans the rest. Running steps never move, and here the finish time holds.", "Under the hood: vision finds the objects. A scheduler plans in milliseconds. An executor re-plans on every event. Skills are a slot: inverse kinematics, or a learned policy like the VLA that opened this film. We fine-tuned X-VLA, 0.9 billion parameters, ourselves.", "It doesn't stop at two. The same skills, three arms, a different job, still managed by Orchestra. Arms join mid-task and the work re-splits around them. The task changes. The system doesn't.", "Every arm you saw ran the same skills. Orchestra managed the rest. That is the impact: robot skills become reusable. Capacity you add in seconds, not weeks.", "Built in 48 hours. Orchestra: plug in an arm, watch the clock drop."];
let i=0;const v=document.getElementById('v'),n=document.getElementById('n'),t=document.getElementById('t'),h=document.getElementById('h');
function clip(k){return 'clips/'+String(k).padStart(2,'0')+'.mp4'}
function show(k){i=Math.max(0,Math.min(LINES.length-1,k));v.src=clip(i+1);v.play();n.textContent=i+1;t.textContent=(i+1)+': '+LINES[i];
  if(i+1<LINES.length){const p=document.createElement('link');p.rel='preload';p.as='video';p.href=clip(i+2);document.head.appendChild(p);}}
document.addEventListener('click',()=>show(i+1));
document.addEventListener('keydown',e=>{const k=e.key;
  if(k===' '||k==='ArrowRight'||k==='PageDown'){e.preventDefault();show(i+1)}
  else if(k==='ArrowLeft'||k==='PageUp')show(i-1)
  else if(k==='t'||k==='T')t.style.display=t.style.display==='block'?'none':'block'
  else if(k==='n'||k==='N')n.style.display=n.style.display==='none'?'block':'none'
  else if(k==='f'||k==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
  else if(k==='r'||k==='R'){v.currentTime=0;v.play()}
  h.style.display='none';});
show(0);
</script></body></html>
